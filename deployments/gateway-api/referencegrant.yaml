apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: traefik-gateway-allow-cross-namespace
  namespace: traefik-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: portainer
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
