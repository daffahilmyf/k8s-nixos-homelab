apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  namespace: default
  name: gateway-example
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: gateway-system
  hostnames:
    - example.tesutotech.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: example-backend
          port: 8080
