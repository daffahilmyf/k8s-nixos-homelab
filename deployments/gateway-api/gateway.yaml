apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  namespace: traefik-system
  name: traefik-gateway
spec:
  gatewayClassName: traefik-gatewayclass
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        credentialRefs:
          - group: ""
            kind: Secret
            name: traefik-gateway-cert
      allowedRoutes:
        namespaces:
          from: All
