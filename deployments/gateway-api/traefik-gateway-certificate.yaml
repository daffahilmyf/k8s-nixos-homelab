apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-gateway-cert
  namespace: traefik-system
spec:
  secretName: traefik-gateway-cert
  issuerRef:
    apiGroup: cert-manager.io
    kind: ClusterIssuer
    name: traefik-selfsigned
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - "*.tesutotech.my.id"
    - "tesutotech.my.id"
  usages:
    - digital signature
    - key encipherment
    - server auth
