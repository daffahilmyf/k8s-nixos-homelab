apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: argocd-gateway
  namespace: argocd
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-system
  hostnames:
    - argocd.tesutotech.my.id
  rules:
    - matches:
        - path:
            type: Prefix
            value: /
      backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
