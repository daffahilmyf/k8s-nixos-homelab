apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1.5"
              memory: "1.5Gi"
