apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  labels:
    app: victoria-logs
spec:
  selector:
    app: victoria-logs
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 8400
      targetPort: 8400
      protocol: TCP
      name: search
  type: ClusterIP
