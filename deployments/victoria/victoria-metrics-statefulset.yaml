apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-metrics
  labels:
    app: victoria-metrics
spec:
  serviceName: victoria-metrics
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.110.0
          args:
            - -storageDataPath=/victoria-metrics-data
            - -retentionPeriod=30
            - -memory.allowedPercent=80
            - -httpListenAddr=:8428
          ports:
            - containerPort: 8428
              name: http
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
      volumes:
        - name: data
          emptyDir: {}
